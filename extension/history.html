<!doctype html>
<html><head><meta charset="utf-8"><title>Why Am I Here</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:860px;margin:32px auto;padding:0 16px;color:#222}
  h1{margin-bottom:4px} .sub{color:#777;margin-bottom:24px}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  .stat{background:#f3f4f8;border-radius:10px;padding:12px 16px;min-width:130px}
  .stat b{display:block;font-size:22px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #eee;vertical-align:top}
  .yes{color:#1a8f4c}.partly{color:#b7791f}.no{color:#c53030}.unrecorded{color:#999}
  textarea{width:100%;height:110px;font-family:monospace} button{padding:6px 12px;margin-right:6px;cursor:pointer}
  h2{margin-top:32px}
</style></head><body>
<h1>Why Am I Here</h1><div class="sub">Why you actually went there.</div>
<div class="stats" id="stats"></div>
<h2>History</h2>
<table><thead><tr><th>When</th><th>Site</th><th>Reason</th><th>Planned</th><th>Actual</th><th>Did it?</th></tr></thead><tbody id="rows"></tbody></table>
<h2>Watched sites</h2>
<p>One per line (e.g. <code>youtube.com</code>). Subdomains match automatically.</p>
<textarea id="sites"></textarea><br>
<button id="save">Save sites</button><button id="export">Export log (JSON)</button><button id="clear">Clear log</button>
<script src="history.js"></script></body></html>
